    <!-- Firebase 모듈 추가 (방 목록 동기화용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let app, auth, db, appId;
        let isFirebaseReady = false;

        try {
            appId = typeof __app_id !== 'undefined' ? __app_id : 'chrono-tether-default';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (firebaseConfig) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isFirebaseReady = true;
            }
        } catch (e) {
            console.warn("방 목록 서버 초기화 실패 - 네트워크 기능이 제한될 수 있습니다.", e);
        }

        async function authenticate() {
            if (!isFirebaseReady) return false;
            if (auth.currentUser) return true;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                return true;
            } catch (error) {
                console.error("서버 인증 에러:", error);
                return false;
            }
        }

        // 글로벌 윈도우 객체에 방 등록 기능 추가
        window.fbRegisterRoom = async function(peerId, roomName) {
            if (!(await authenticate())) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', peerId);
                await setDoc(roomRef, {
                    peerId: peerId,
                    hostName: roomName || 'Chrono 파쿠르',
                    status: 'waiting',
                    createdAt: Date.now()
                });
            } catch (e) { console.error("방 등록 실패:", e); }
        };

        window.fbUnregisterRoom = async function(peerId) {
            if (!(await authenticate())) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', peerId);
                await deleteDoc(roomRef);
            } catch (e) { console.error("방 삭제 실패:", e); }
        };

        window.fbFetchRooms = async function() {
            if (!(await authenticate())) return null;
            try {
                const roomsCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
                const snapshot = await getDocs(roomsCol); 
                const rooms = [];
                const now = Date.now();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // 대기 중이며, 만들어진지 1시간이 지나지 않은 방만 표시
                    if (data.status === 'waiting' && (now - data.createdAt) < 3600000) {
                        rooms.push(data);
                    }
                });
                return rooms;
            } catch (e) { 
                console.error("방 목록 로드 실패:", e); 
                return null;
            }
        };
    </script>
